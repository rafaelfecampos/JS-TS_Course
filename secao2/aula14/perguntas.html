<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Exercícios aula 13</title>
</head>
<body>
  
  <script>
  const numero = Number(prompt('Digite um número'));
  document.body.innerHTML += `Seu número é: <strong>${numero}</strong><br />`;
  document.body.innerHTML += `Raiz Quadrada: ${Math.pow(numero, 2)}<br />`;
  document.body.innerHTML += `${numero} é inteiro: ${Number.isInteger(numero)}<br />`;
  document.body.innerHTML += `É NaN: ${Number.isNaN(numero)}<br />`;
  document.body.innerHTML += `Arredondado para baixo: ${Math.floor(numero)}<br />`;
  document.body.innerHTML += `Arredondado para cima: ${Math.ceil(numero)}<br />`;
  document.body.innerHTML += `Arredondado com duas casas decimais: ${numero.toFixed(2)}<br />`;

  </script>
</body>
</html>
